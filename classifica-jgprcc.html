<html lang="it">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Classifiche Junior & Rookies 2026 — Moto2026</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
      --red:    #e8001d;
      --dark:   #0a0a0a;
      --mid:    #141414;
      --card:   #1a1a1a;
      --border: #2a2a2a;
      --muted:  #888;
      --white:  #f5f5f5;
      --rrc:    #325de9;
      --jgp-m2: #f7a600;
      --jgp-m3: #00b4d8;
      --jgp-m4: #ff6b35;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── HEADER MINIMALE ── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(10,10,10,.96);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--red);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem; height: 60px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: .08em;
      color: var(--white); text-decoration: none;
    }
    .logo span { color: var(--red); }
    .header-right { display: flex; align-items: center; gap: .5rem; }
    .auth-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; border-radius: 6px;
      padding: .28rem .65rem; font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: .78rem; letter-spacing: .06em;
      text-transform: uppercase; transition: all .15s;
    }
    .auth-btn:hover { border-color: var(--red); color: var(--white); }
    #theme-toggle {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; border-radius: 6px;
      padding: .3rem .5rem; font-size: .9rem; line-height: 1;
      display: flex; align-items: center; transition: all .15s;
    }
    #theme-toggle:hover { transform: rotate(20deg); border-color: var(--red); color: var(--white); }

    /* ── PAGE HERO ── */
    .page-hero {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0015 60%, #0a0a0a 100%);
      padding: 3rem 2rem; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .page-hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem); line-height: 1;
      letter-spacing: .02em; margin-bottom: .5rem;
    }
    .page-hero h1 span { color: var(--red); }
    .page-hero p { color: var(--muted); max-width: 600px; margin: 0 auto; }

    /* ── LAYOUT MAIN ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

     /* ── BOTTONE TORNA HOME ── */
    .back-home-wrap {
      text-align: center; margin-bottom: 2rem;
    }
    .btn-red {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .95rem;
      letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
      padding: .7rem 1.6rem; border-radius: 3px; transition: all .2s;
      cursor: pointer; border: none; color: #fff; background: var(--red);
    }
    .btn-red:hover { background: #c4001a; transform: translateY(-2px); }

    /* ── TABS CATEGORIE ── */
    .cat-tabs {
      display: flex; gap: 0; margin-bottom: 2rem;
      border-bottom: 2px solid var(--border); overflow-x: auto;
    }
    .tab-btn {
      flex: 1; padding: 1rem .5rem;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem;
      letter-spacing: .06em; text-transform: uppercase; text-align: center;
      background: transparent; color: var(--muted); border: none; border-bottom: 3px solid transparent;
      cursor: pointer; transition: all .2s; white-space: nowrap; margin-bottom: -2px;
    }
    .tab-btn:hover { color: var(--white); }
    .tab-btn.active { color: var(--white); }
    .tab-btn[data-cat="rrc"].active { border-bottom-color: var(--rrc); color: var(--rrc); }
    .tab-btn[data-cat="jgp_m2"].active { border-bottom-color: var(--jgp-m2); color: var(--jgp-m2); }
    .tab-btn[data-cat="jgp_m3"].active { border-bottom-color: var(--jgp-m3); color: var(--jgp-m3); }
    .tab-btn[data-cat="jgp_m4"].active { border-bottom-color: var(--jgp-m4); color: var(--jgp-m4); }

    /* ── STANDINGS CARD ── */
    .standings-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; display: none;
      animation: fadeIn .3s ease;
    }
    .standings-card.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .sc-header {
      padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: .04em;
    }
    .sc-header.rrc { background: rgba(50,93,233,.1); color: var(--rrc); border-bottom: 2px solid var(--rrc); }
    .sc-header.jgp_m2 { background: rgba(247,166,0,.1); color: var(--jgp-m2); border-bottom: 2px solid var(--jgp-m2); }
    .sc-header.jgp_m3 { background: rgba(0,180,216,.1); color: var(--jgp-m3); border-bottom: 2px solid var(--jgp-m3); }
    .sc-header.jgp_m4 { background: rgba(255,107,53,.1); color: var(--jgp-m4); border-bottom: 2px solid var(--jgp-m4); }

    /* ── BARRA PROGRESSIONE STAGIONE ── */
    .season-progress-wrap {
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      background: var(--mid);
    }
    .season-progress-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .6rem; font-family: 'Barlow Condensed', sans-serif; font-size: .8rem;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    }
    .season-progress-track {
      height: 6px; background: var(--card); border-radius: 4px; overflow: hidden;
    }
    .season-progress-fill {
      height: 100%; border-radius: 4px; transition: width 1s cubic-bezier(.4,0,.2,1); width: 0;
    }
    .standings-card.rrc .season-progress-fill { background: linear-gradient(90deg, var(--rrc), #8ab1ff); }
    .standings-card.jgp_m2 .season-progress-fill { background: linear-gradient(90deg, var(--jgp-m2), #ffd966); }
    .standings-card.jgp_m3 .season-progress-fill { background: linear-gradient(90deg, var(--jgp-m3), #66d9ff); }
    .standings-card.jgp_m4 .season-progress-fill { background: linear-gradient(90deg, var(--jgp-m4), #ff9c66); }

    /* ── TOP 3 PODIO CARD ── */
    .podium-wrap {
      display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 1rem;
      padding: 2rem 1.5rem 1.5rem; align-items: flex-end; background: var(--card);
    }
    .podium-card {
      background: var(--mid); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.2rem 1rem; text-align: center; position: relative; transition: transform .2s;
    }
    .podium-card:hover { transform: translateY(-5px); border-color: #555; }
    .podium-card.pos-2 { order: 1; }
    .podium-card.pos-1 { order: 2; transform: translateY(-15px); }
    .podium-card.pos-3 { order: 3; }
    .podium-card.pos-1:hover { transform: translateY(-20px); }

    .podium-rank {
      font-family: 'Bebas Neue', sans-serif; font-size: 3rem; opacity: 0.15;
      position: absolute; top: 0.5rem; left: 50%; transform: translateX(-50%); line-height: 1;
    }
    .podium-flag { font-size: 2.5rem; display: block; margin-bottom: .5rem; position: relative; z-index: 1; }
    .podium-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.1rem; margin-bottom: .2rem; position: relative; z-index: 1; }
    .podium-team { font-size: .75rem; color: var(--muted); margin-bottom: .8rem; position: relative; z-index: 1; }
    .podium-pts { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; line-height: 1; position: relative; z-index: 1; }
    .podium-pts-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

    .standings-card.rrc .podium-card.pos-1 { border-top: 4px solid var(--rrc); }
    .standings-card.rrc .podium-pts { color: var(--rrc); }
    .standings-card.jgp_m2 .podium-card.pos-1 { border-top: 4px solid var(--jgp-m2); }
    .standings-card.jgp_m2 .podium-pts { color: var(--jgp-m2); }
    .standings-card.jgp_m3 .podium-card.pos-1 { border-top: 4px solid var(--jgp-m3); }
    .standings-card.jgp_m3 .podium-pts { color: var(--jgp-m3); }
    .standings-card.jgp_m4 .podium-card.pos-1 { border-top: 4px solid var(--jgp-m4); }
    .standings-card.jgp_m4 .podium-pts { color: var(--jgp-m4); }

    @media (max-width: 600px) {
      .podium-wrap { grid-template-columns: 1fr; gap: .8rem; padding: 1.5rem 1rem; }
      .podium-card.pos-1 { order: 1; transform: none; }
      .podium-card.pos-2 { order: 2; }
      .podium-card.pos-3 { order: 3; }
      .podium-card.pos-1:hover { transform: translateY(-5px); }
    }

    /* ── BARRA RICERCA PILOTI ── */
    .search-wrap {
      padding: 1rem 1.5rem; background: var(--mid); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .8rem;
    }
    .search-input {
      flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      color: var(--white); padding: .5rem .8rem; font-family: 'Barlow', sans-serif; font-size: .9rem;
      outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--red); }
    .search-input::placeholder { color: var(--muted); }
    .search-label { font-family: 'Barlow Condensed', sans-serif; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }

    /* ── TABELLA CLASSIFICA ── */
    .standings-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .8rem 1.5rem; text-align: left; font-size: .95rem; }
    th {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; font-size: .75rem;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    tr:hover td { background: rgba(255,255,255,.02); }
    
    /* Evidenziazione Top 5 */
    tr.top-5 td { background: rgba(255,255,255,.03); }
    tr.top-5:hover td { background: rgba(255,255,255,.05); }

    .pos { color: var(--muted); width: 40px; font-weight: 700; text-align: center; }
    .pts { font-weight: 700; text-align: right; width: 80px; }
    .gap { text-align: right; width: 80px; color: var(--muted); font-size: .85rem; }
    
    .standings-card.rrc .pts { color: var(--rrc); }
    .standings-card.jgp_m2 .pts { color: var(--jgp-m2); }
    .standings-card.jgp_m3 .pts { color: var(--jgp-m3); }
    .standings-card.jgp_m4 .pts { color: var(--jgp-m4); }

    .rider-cell { display: flex; align-items: center; gap: .8rem; }
    .rider-flag { font-size: 1.2rem; }
    .rider-team { font-size: .8rem; color: var(--muted); display: block; }

    /* ── FOOTER MINI ── */
    footer {
      text-align: center; padding: 2rem; color: var(--muted);
      font-size: .8rem; border-top: 1px solid var(--border); margin-top: 2rem;
    }

    /* ── LIGHT MODE ── */
    [data-theme="light"] { --dark: #f4f4f4; --mid: #e8e8e8; --card: #ffffff; --border: #d0d0d0; --muted: #666; --white: #111; }
    [data-theme="light"] body { background: #f4f4f4; color: #111; }
    [data-theme="light"] header { background: rgba(248,248,248,.97); }
    [data-theme="light"] .auth-btn, [data-theme="light"] #theme-toggle { background: #fff; border-color: #d0d0d0; color: #111; }
    [data-theme="light"] .page-hero { background: linear-gradient(135deg, #fff 0%, #ffe8e8 60%, #fff0f0 100%); }
    [data-theme="light"] tr:hover td { background: rgba(0,0,0,.02); }
    [data-theme="light"] .btn-outline { border-color: #aaa; color: #111; }
    [data-theme="light"] .btn-outline:hover { border-color: #111; }
    [data-theme="light"] .season-progress-track { background: #e0e0e0; }
    [data-theme="light"] .podium-card { background: #f0f0f0; }
    [data-theme="light"] .search-input { background: #fff; border-color: #d0d0d0; color: #111; }
    [data-theme="light"] tr.top-5 td { background: rgba(0,0,0,.03); }
</style>
</head>

// ── LOGICA GENERAZIONE TABELLE, PODIO E PROGRESSIONE ──
function generateStandings() {
  const container = document.getElementById('standings-container');
  let html = '';

  for (const catKey in CHAMPIONSHIPS) {
    const cat = CHAMPIONSHIPS[catKey];
    const classifiedRiders = cat.riders.filter(r => r.pts > 0);
    
    // Calcolo progressione stagionale con sicurezza al 100%
    const progressPct = Math.min(100, Math.round((cat.roundsDone / cat.roundsTotal) * 100));
    
    // Prendi il punteggio del leader per calcolare il distacco
    const leaderPts = classifiedRiders.length > 0 ? classifiedRiders[0].pts : 0;

    html += `<div class="standings-card ${cat.colorClass} ${catKey === 'rrc' ? 'active' : ''}" id="tab-${catKey}">`;
    html += `<div class="sc-header ${cat.colorClass}">${cat.name}</div>`;
    
    // 1. BARRA PROGRESSIONE STAGIONE
    html += `<div class="season-progress-wrap">
      <div class="season-progress-header">
        <span>⚡ Stagione in corso</span>
        <span>Round ${cat.roundsDone} / ${cat.roundsTotal}</span>
      </div>
      <div class="season-progress-track">
        <div class="season-progress-fill" style="width: ${progressPct}%;"></div>
      </div>
    </div>`;

    // 2. PODIO TOP 3
    const top3 = classifiedRiders.slice(0, 3);
    const podiumOrder = [
        { rider: top3[1], posClass: 'pos-2' },
        { rider: top3[0], posClass: 'pos-1' },
        { rider: top3[2], posClass: 'pos-3' }
    ];

    html += `<div class="podium-wrap">`;
    podiumOrder.forEach(p => {
        if (!p.rider) return;
        html += `
          <div class="podium-card ${p.posClass}">
            <div class="podium-rank">${p.rider.pos}</div>
            <span class="podium-flag">${p.rider.flag}</span>
            <div class="podium-name">${p.rider.name}</div>
            <div class="podium-team">${p.rider.team}</div>
            <div class="podium-pts">${p.rider.pts}</div>
            <div class="podium-pts-label">Punti</div>
          </div>
        `;
    });
    html += `</div>`;

    // 3. BARRA DI RICERCA
    html += `<div class="search-wrap">
      <span class="search-label">🔍 Cerca pilota:</span>
      <input type="text" class="search-input" placeholder="Nome pilota..." oninput="filterRiders(this, '${catKey}')">
    </div>`;

    // 4. TABELLA CLASSIFICA COMPLETA
    html += `<div class="standings-table-wrap"><table id="table-${catKey}">
      <thead>
        <tr>
          <th class="pos">#</th>
          <th>Pilota</th>
          <th class="pts">Punti</th>
          <th class="gap">Distacco</th>
        </tr>
      </thead>
      <tbody>`;

    classifiedRiders.forEach(r => {
      const gapVal = r.pos === 1 ? "Leader" : `-${leaderPts - r.pts}`;
      const topClass = r.pos <= 5 ? 'top-5' : ''; // Evidenzia i primi 5
      html += `<tr class="${topClass}">
        <td class="pos">${r.pos}</td>
        <td>
          <div class="rider-cell">
            <span class="rider-flag">${r.flag}</span>
            <span>${r.name}<span class="rider-team">${r.team}</span></span>
          </div>
        </td>
        <td class="pts">${r.pts}</td>
        <td class="gap">${gapVal}</td>
      </tr>`;
    });

    html += `</tbody></table></div>`;
    html += `</div>`; // Chiudi Card
  }

  container.innerHTML = html;
}

// ── LOGICA RICERCA PILOTI NELLA TABELLA ──
function filterRiders(input, catKey) {
    var filter = input.value.toUpperCase();
    var table = document.getElementById("table-" + catKey);
    var tr = table.getElementsByTagName("tr");
    
    for (var i = 1; i < tr.length; i++) { // Parto da 1 per saltare l'header
        var td = tr[i].getElementsByTagName("td")[1]; // Prendo la colonna "Pilota"
        if (td) {
            var txtValue = td.textContent || td.innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
}

// ── LOGICA TABS E DEEP LINKING ──
function switchTab(cat) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.standings-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[data-cat="${cat}"]`).classList.add('active');
  document.getElementById(`tab-${cat}`).classList.add('active');
  
  // Aggiorna l'URL per la condivisione diretta
  history.replaceState(null, null, "#" + cat);
}

// All'avvio, controlla se c'è un tab specifico nell'URL (es. classifica-jgprcc.html#jgp_m4)
window.addEventListener('load', function() {
    var hash = window.location.hash.replace('#', '');
    if (hash && CHAMPIONSHIPS[hash]) {
        switchTab(hash);
    }
});

// ── TEMA DARK/LIGHT ──
function initTheme() {
  const saved = localStorage.getItem('moto2026-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = saved === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('moto2026-theme', next);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = next === 'dark' ? '☀️' : '🌙';
}

// ── SISTEMA LOGIN ──
function initAuth() {
  var user = JSON.parse(localStorage.getItem('moto2026_current'));
  var headerRight = document.querySelector('.header-right');
  var old = headerRight.querySelector('.auth-btn, .user-avatar-btn');
  if (old) old.remove();

  if (user) {
    var initials = user.username.slice(0,2).toUpperCase();
    var btn = document.createElement('button');
    btn.className = 'user-avatar-btn';
    btn.style.cssText = 'width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-family:Bebas Neue;font-size:.85rem;display:flex;align-items:center;justify-content:center;';
    btn.textContent = initials;
    btn.onclick = function() { alert('Ciao ' + user.username + '! (Qui ci va il menu a tendina)'); };
    headerRight.prepend(btn);
  } else {
    var btn = document.createElement('button');
    btn.className = 'auth-btn';
    btn.textContent = 'Accedi';
    btn.onclick = function() { alert('Vai nella pagina Home per effettuare il login!'); };
    headerRight.prepend(btn);
  }
}

// Avvia tutto
initTheme();
initAuth();
generateStandings();
</script>
