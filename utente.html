<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profilo Utente — Moto2026</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --red:#e8001d; --dark:#0a0a0a; --mid:#141414; --card:#1a1a1a; --border:#2a2a2a; --muted:#8a8a8a; --white:#f5f5f5; }
    [data-theme="light"] { --dark:#f5f5f5; --mid:#ececec; --card:#fff; --border:#d8d8d8; --muted:#666; --white:#111; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; line-height:1.6; min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem; }
    .container { width:100%; max-width:600px; }
    .back-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1rem; border-radius:6px; background:var(--mid); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.8rem; margin-bottom:2rem; }
    .profile-header { text-align:center; margin-bottom:2rem; }
    .avatar { width:80px; height:80px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:2rem; font-family:'Bebas Neue',sans-serif; margin:0 auto 1rem; }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; }
    .bio { color:var(--muted); font-size:.9rem; margin-top:.5rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; }
    .stat-row { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid var(--border); }
    .stat-label { color:var(--muted); }
    .fav-item { padding:.5rem 0; border-bottom:1px solid var(--border); font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; }
    .fav-item a { color:var(--white); text-decoration:none; }
    .fav-item a:hover { color:var(--red); }
    .loading { text-align:center; color:var(--muted); padding:3rem 0; }
</style>
</head>
<body>

<div class="container">
    <div class="back-btn-wrap" style="margin-bottom: 2rem;"></div>    
    <div id="profile-content">
        <p class="loading">Caricamento profilo...</p>
    </div>
</div>

<script>
// Inizializza Supabase
const SUPABASE_URL = 'https://aysknebyyzljysxpsxdv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M1dPlowaVyeMJ1PXYl0uNw_Ha4GR_wZ';
const s = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadPublicProfile() {
    // Prendi l'username dall'URL (es. ?username=paggi)
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username');
    
    if (!username) {
        document.getElementById('profile-content').innerHTML = '<p class="loading">Nessun utente specificato.</p>';
        return;
    }
    
    // 1. Prendi i dati del profilo (Bio, Team)
    const { data: profileData } = await s.rpc('get_public_profile', { p_username: username });
    
    if (!profileData || profileData.length === 0) {
        document.getElementById('profile-content').innerHTML = '<p class="loading">Profilo non trovato o privato.</p>';
        return;
    }
    
    const profile = profileData[0];
    const initials = profile.username.slice(0,2).toUpperCase();
    
    // 2. Prendi i piloti preferiti di questo utente
    const { data: favs } = await s.from('favorites').select('rider_id, rider_name').eq('user_id', profile.user_id);
    
    // 3. Prendi il numero di pronostici fatti
    const { count: predCount } = await s.from('predictions').select('*', { count: 'exact', head: true }).eq('user_id', profile.user_id);
    
    // Costruisci l'HTML
    var favsHtml = favs && favs.length > 0 ? favs.map(f => 
        '<div class="fav-item">⭐ <a href="pilota.html?id=' + f.rider_id + '">' + f.rider_name + '</a></div>'
    ).join('') : '<p style="color:var(--muted);">Nessun pilota preferito.</p>';
    
    document.getElementById('profile-content').innerHTML = `
        <div class="profile-header">
            <div class="avatar">${initials}</div>
            <h1>${profile.username}</h1>
            <p class="bio">${profile.bio || 'Nessuna bio disponibile.'}</p>
            ${profile.favorite_team ? '<p class="bio">🏁 Team del cuore: ' + profile.favorite_team + '</p>' : ''}
        </div>
        
        <div class="card">
            <div class="card-title">📊 Statistiche</div>
            <div class="stat-row"><span class="stat-label">🎯 GP Pronosticati</span> <span>${predCount || 0}</span></div>
            <div class="stat-row"><span class="stat-label">⭐ Piloti Seguiti</span> <span>${favs ? favs.length : 0}</span></div>
        </div>
        
        <div class="card">
            <div class="card-title">⭐ Piloti Preferiti</div>
            ${favsHtml}
        </div>
    `;
}
  // Inietta il bottone "Torna indietro" usando la cronologia del browser
var backWrap = document.querySelector('.back-btn-wrap');
if (backWrap) {
    backWrap.innerHTML = '<a href="#" class="back-btn" onclick="event.preventDefault(); window.history.back();">← Torna alla pagina precedente</a>';
}
loadPublicProfile();
</script>
</body>
</html>
