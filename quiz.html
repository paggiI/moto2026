<style>
    :root { --red:#e8001d; --dark:#0a0a0a; --mid:#141414; --card:#1a1a1a; --border:#2a2a2a; --muted:#8a8a8a; --white:#f5f5f5; --green:#2ecc71; }
    [data-theme="light"] { --dark:#f5f5f5; --mid:#ececec; --card:#fff; --border:#d8d8d8; --muted:#666; --white:#111; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; line-height:1.6; min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem; }
    .container { width:100%; max-width:600px; }
    .back-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1rem; border-radius:6px; background:var(--mid); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.8rem; margin-bottom:2rem; }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:.04em; margin-bottom:.5rem; }
    h1 span { color:var(--red); }
    .subtitle { color:var(--muted); margin-bottom:2.5rem; font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; margin-bottom:1.5rem; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    .q-title { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; margin-bottom:1.5rem; line-height:1.3; }
    .q-option { display:block; width:100%; background:var(--mid); border:1px solid var(--border); color:var(--white); padding:1rem; border-radius:8px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:1.1rem; margin-bottom:.8rem; transition:.2s; text-align:left; }
    .q-option:hover { border-color:var(--red); background:rgba(232,0,29,.05); }
    .q-option.correct { border-color:var(--green); color:var(--green); background:rgba(46,204,113,.1); pointer-events:none; }
    .q-option.wrong { border-color:#ff6b6b; color:#ff6b6b; background:rgba(255,107,107,.1); pointer-events:none; }
    .q-option.disabled { pointer-events:none; opacity:0.7; }
    .next-btn { display:none; margin-top:1.5rem; width:100%; background:var(--red); color:#fff; border:none; padding:.8rem; border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1rem; text-transform:uppercase; cursor:pointer; }
    .next-btn.show { display:block; }
    .result-score { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:var(--red); text-align:center; margin:1rem 0; }
    .loading { text-align:center; color:var(--muted); padding:3rem 0; }
    .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:1rem 1.5rem; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; z-index:9999; display:none; }

<script>

    correct: 1
  },
  {

    correct: 2
  },
  {
    id: 'australia_extra_q4',

    correct: 2

let currentUser = null;
let answeredMap = {}; // Mappa delle domande già risposte (question_id -> is_correct)
let currentQIndex = 0;

let activeQuestions = []; // Creiamo un array vuoto per le domande da fare

async function initQuizPage() {
    const { data: { session } } = await s.auth.getSession();
    currentUser = session?.user || null;
    
    if (!currentUser) {
        document.getElementById('quiz-card').innerHTML = '<p class="loading">Devi essere loggato per giocare.<br><br><a href="index.html" style="color:var(--red); text-decoration:none; font-weight:700;">← Torna alla Home</a></p>';
        return;
    }
    
    // Scarica le risposte già date
    const { data: existingAnswers } = await s.from('quiz_answers').select('question_id, is_correct').eq('user_id', currentUser.id);
    
    if (existingAnswers) {
        existingAnswers.forEach(a => { answeredMap[a.question_id] = a.is_correct; });
    }
    
    // Filtra solo le domande NON ancora risposte e mescolale
    activeQuestions = QUIZ_QUESTIONS.filter(q => answeredMap[q.id] === undefined);
    shuffleArray(activeQuestions);
    
    if (activeQuestions.length === 0) {
        showFinalResults();
    } else {
        currentQIndex = 0;
        renderQuestion(currentQIndex);
    }
}

// Funzione per mescolare l'array
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function renderQuestion(index) {
    if (index >= activeQuestions.length) {
        showFinalResults();
        return;
    }
    
    const q = activeQuestions[index];
    let optionsHtml = '';
    q.options.forEach((opt, i) => {
        optionsHtml += `<button class="q-option" onclick="submitAnswer('${q.id}', ${i}, ${q.correct})">${opt}</button>`;
    });
    
    document.getElementById('quiz-card').innerHTML = `
        <div style="font-size:.8rem; color:var(--muted); font-family:'Barlow Condensed'; text-transform:uppercase; margin-bottom:.5rem;">Domanda ${index + 1} di ${activeQuestions.length}</div>
        <div class="q-title">${q.question}</div>
        <div id="options-wrap">${optionsHtml}</div>
        <button class="next-btn" id="next-btn" onclick="renderQuestion(${index + 1})">Prossima domanda →</button>
    `;
}

async function submitAnswer(qId, selectedIdx, correctIdx) {
    const isCorrect = selectedIdx === correctIdx;
    
    // Disabilita i bottoni e colora le risposte
    const wrap = document.getElementById('options-wrap');
    const btns = wrap.querySelectorAll('.q-option');
    btns.forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === correctIdx) btn.classList.add('correct');
        if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
    });
    
    // Mostra il bottone "Prossima"
    document.getElementById('next-btn').classList.add('show');
    
    // Salva nel database
    const { error } = await s.from('quiz_answers').insert({
        user_id: currentUser.id,
        question_id: qId,
        is_correct: isCorrect
    });
    
    if (error) {
        showToast('Errore nel salvataggio della risposta.', true);
    } else {
        answeredMap[qId] = isCorrect;
        if (isCorrect) showToast('✅ Risposta correta! +1 punto');
        else showToast('❌ Risposta sbagliata.');
    }
}

function showFinalResults() {
    let correctCount = 0;
    for (let key in answeredMap) {
        if (answeredMap[key] === true) correctCount++;
    }
    
    const total = QUIZ_QUESTIONS.length;
    const percentage = Math.round((correctCount / total) * 100);
    
    let msg = '';
    if (percentage === 100) msg = '🥇 Perfetto! Sei un esperto di MotoGP!';
    else if (percentage >= 75) msg = '🥈 Ottimo lavoro! Conosci bene il Motomondiale.';
    else if (percentage >= 50) msg = '🥉 Discreto, ma c\'è margine di miglioramento!';
    else msg = '📚 Meglio ripassare un po\' di storia del Motomondiale!';
    
    document.getElementById('quiz-card').innerHTML = `
        <div style="text-align:center;">
            <h2 style="font-family:'Bebas Neue'; font-size:1.8rem; margin-bottom:1rem;">Risultato Quiz</h2>
            <div class="result-score">${correctCount} / ${total}</div>
            <p style="color:var(--muted); font-size:1.1rem; margin-bottom:1.5rem;">${msg}</p>
            <p style="font-size:.9rem; color:var(--muted);">I tuoi punti sono stati aggiunti alla Classifica Globale!</p>
            <a href="classifica_pronostici.html" style="display:inline-block; margin-top:1.5rem; background:var(--red); color:#fff; padding:.6rem 1.5rem; border-radius:6px; text-decoration:none; font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase;">🏆 Vedi Classifica</a>
            
            <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border);">
                <p style="font-size:.85rem; color:var(--muted); margin-bottom:.8rem;">Vuoi rigiocare? Cliccando qui cancellerai le tue risposte precedenti per ripartire da zero.</p>
                <button onclick="resetQuiz()" style="background:transparent; border:1px solid var(--border); color:#ff6b6b; padding:.5rem 1.2rem; border-radius:6px; cursor:pointer; font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; font-size:.85rem;">🔄 Ricomincia il Quiz</button>
            </div>
        </div>
    `;
}

// Funzione per azzerare tutte le risposte
async function resetQuiz() {
    if (!confirm('Sei sicuro di voler azzerare tutte le tue risposte? Perderai i punti acquisiti finora nel quiz!')) return;
    
    const { error } = await s.from('quiz_answers').delete().eq('user_id', currentUser.id);
    
    if (error) {
        showToast('Errore durante il reset.', true);
    } else {
        // Svuota la mappa delle risposte in locale
        for (let key in answeredMap) { delete answeredMap[key]; }
        
        // Ricarica le domande
        activeQuestions = QUIZ_QUESTIONS.filter(q => answeredMap[q.id] === undefined);
        shuffleArray(activeQuestions);
        
        if (activeQuestions.length > 0) {
            currentQIndex = 0;
            renderQuestion(currentQIndex);
        } else {
            showFinalResults();
        }
        showToast('✅ Quiz azzerato! Puoi ricominciare.');
    }
}

function showToast(msg, isError = false) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e8001d' : '#222';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// BOTTONE TORNA INDIETRO
var backWrap = document.querySelector('.back-btn-wrap');
if (backWrap) {
    backWrap.innerHTML = '<a href="#" class="back-btn" onclick="event.preventDefault(); window.history.back();">← Torna alla pagina precedente</a>';
}

initQuizPage();
</script>
