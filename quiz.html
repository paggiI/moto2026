<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --red:#e8001d; --dark:#0a0a0a; --mid:#141414; --card:#1a1a1a; --border:#2a2a2a; --muted:#8a8a8a; --white:#f5f5f5; --green:#2ecc71; }
    [data-theme="light"] { --dark:#f5f5f5; --mid:#ececec; --card:#fff; --border:#d8d8d8; --muted:#666; --white:#111; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; line-height:1.6; min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem; }
    .container { width:100%; max-width:600px; }
    .back-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1rem; border-radius:6px; background:var(--mid); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.8rem; margin-bottom:2rem; transition: all .15s; }
    .back-btn:hover { border-color:var(--red); color:var(--white); }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:.04em; margin-bottom:.5rem; }
    h1 span { color:var(--red); }
    .subtitle { color:var(--muted); margin-bottom:2.5rem; font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem; margin-bottom:1.5rem; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    .q-title { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; margin-bottom:1.5rem; line-height:1.3; }
    .q-option { display:block; width:100%; background:var(--mid); border:1px solid var(--border); color:var(--white); padding:1rem; border-radius:8px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:1.1rem; margin-bottom:.8rem; transition:.2s; text-align:left; }
    .q-option:hover { border-color:var(--red); background:rgba(232,0,29,.05); }
    .q-option.correct { border-color:var(--green); color:var(--green); background:rgba(46,204,113,.1); pointer-events:none; }
    .q-option.wrong { border-color:#ff6b6b; color:#ff6b6b; background:rgba(255,107,107,.1); pointer-events:none; }
    .q-option.disabled { pointer-events:none; opacity:0.7; }
    .next-btn { display:none; margin-top:1.5rem; width:100%; background:var(--red); color:#fff; border:none; padding:.8rem; border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1rem; text-transform:uppercase; cursor:pointer; }
    .next-btn.show { display:block; }
    .result-score { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:var(--red); text-align:center; margin:1rem 0; }
    .loading { text-align:center; color:var(--muted); padding:3rem 0; }
    .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:1rem 1.5rem; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; z-index:9999; display:none; }
    .progress-info { font-size:.75rem; color:var(--muted); font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.5rem; }
</style>
</head>
<body>

        <p class="loading">Caricamento domande...</p>

</div>

<div id="toast" class="toast"></div>

<script>

  },
  {

  // CURIOSIT\u00c0 SUL CIRCUITO
  {

  {

  },
  {

    correct: 1
  },
  {

    options: [

      'Caldo e umidit\u00e0 elevata',
      'Vento gelido costante',
      'Altitudine estrema'
    ],
    correct: 1
  }
];

let currentUser = null;
let answeredMap = {}; // Mappa question_id -> is_correct
let currentQIndex = 0;
let activeQuestions = [];

// ============================================================
// GESTIONE STATO IN LOCALSTORAGE
// Salva: lista ID domande nell'ordine corrente + indice domanda attuale
// Cos\u00ec se l'utente lascia la pagina e torna, riprende da dove era
// (lo stato scade dopo 30 giorni)
// ============================================================
function getStorageKey() {
    return currentUser ? 'moto2026_quiz_state_' + currentUser.id : null;
}

function saveQuizState() {
    if (!currentUser) return;
    const state = {
        questionIds: activeQuestions.map(q => q.id),
        currentIndex: currentQIndex,
        savedAt: Date.now()
    };
    try {
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
    } catch (e) {
        console.warn('Impossibile salvare stato quiz:', e);
    }
}

function loadQuizState() {
    if (!currentUser) return null;
    try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return null;
        const state = JSON.parse(raw);
        // Scarta stati pi\u00f9 vecchi di 30 giorni
        if (state.savedAt && (Date.now() - state.savedAt > 30 * 24 * 60 * 60 * 1000)) {
            clearQuizState();
            return null;
        }
        return state;
    } catch (e) {
        return null;
    }
}

function clearQuizState() {
    if (!currentUser) return;
    try {
        localStorage.removeItem(getStorageKey());
    } catch (e) {}
}

async function initQuizPage() {
    const { data: { session } } = await s.auth.getSession();
    currentUser = session?.user || null;

    if (!currentUser) {
        document.getElementById('quiz-card').innerHTML = '<p class="loading">Devi essere loggato per giocare.<br><br><a href="index.html" style="color:var(--red); text-decoration:none; font-weight:700;">\u2190 Torna alla Home</a></p>';
        if (!currentUser) {
            document.getElementById('quiz-card').innerHTML = '<p class="loading">Devi essere loggato per giocare.<br><br><a href="index.html" style="color:var(--red); text-decoration:none; font-weight:700;">← Torna alla Home</a></p>';
            document.getElementById('reset-wrap').style.display = 'none'; // aggiungi questa
            return;
        }
        return;
    }
    // Mostra il pulsante reset (l'utente è loggato)
    document.getElementById('reset-wrap').style.display = 'block';  
    // Scarica le risposte gi\u00e0 date
    const { data: existingAnswers } = await s.from('quiz_answers').select('question_id, is_correct').eq('user_id', currentUser.id);

    if (existingAnswers) {
        existingAnswers.forEach(a => { answeredMap[a.question_id] = a.is_correct; });
    }

    // Filtra solo le domande NON ancora risposte
    const unansweredQuestions = QUIZ_QUESTIONS.filter(q => answeredMap[q.id] === undefined);

    // Controlla se c'\u00e8 uno stato salvato in localStorage
    const savedState = loadQuizState();

    if (savedState && savedState.questionIds && savedState.questionIds.length > 0) {
        // Ripristina l'ordine salvato, skippando le domande ora gi\u00e0 risposte
        // (l'utente potrebbe aver risposto a qualche domanda da un altro dispositivo)
        activeQuestions = savedState.questionIds
            .map(id => unansweredQuestions.find(q => q.id === id))
            .filter(q => q !== undefined);

        // Aggiusta currentIndex se necessario
        if (savedState.currentIndex >= activeQuestions.length) {
            currentQIndex = 0;
        } else {
            currentQIndex = savedState.currentIndex;
        }

        if (activeQuestions.length === 0) {
            clearQuizState();
            showFinalResults();
        } else {
            renderQuestion(currentQIndex);
        }
    } else {
        // Nessuno stato salvato, inizia fresh
        activeQuestions = unansweredQuestions;
        shuffleArray(activeQuestions);

        if (activeQuestions.length === 0) {
            showFinalResults();
        } else {
            currentQIndex = 0;
            renderQuestion(currentQIndex);
        }
    }
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function renderQuestion(index) {
    if (index >= activeQuestions.length) {
        clearQuizState(); // Quiz completato, pulisci stato
        showFinalResults();
        return;
    }

    currentQIndex = index;
    saveQuizState(); // Salva stato corrente (cos\u00ec se l'utente lascia riprende da qui)

    const q = activeQuestions[index];
    let optionsHtml = '';
    q.options.forEach((opt, i) => {
        optionsHtml += '<button class="q-option" onclick="submitAnswer(\'' + q.id + '\', ' + i + ', ' + q.correct + ')">' + opt + '</button>';
    });

    document.getElementById('quiz-card').innerHTML =
        '<div class="progress-info">Domanda ' + (index + 1) + ' di ' + activeQuestions.length + '</div>' +
        '<div class="q-title">' + q.question + '</div>' +
        '<div id="options-wrap">' + optionsHtml + '</div>' +
        '<button class="next-btn" id="next-btn" onclick="renderQuestion(' + (index + 1) + ')">Prossima domanda \u2192</button>';
}

async function submitAnswer(qId, selectedIdx, correctIdx) {
    const isCorrect = selectedIdx === correctIdx;

    // Disabilita i bottoni e colora le risposte
    const wrap = document.getElementById('options-wrap');
    const btns = wrap.querySelectorAll('.q-option');
    btns.forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === correctIdx) btn.classList.add('correct');
        if (i === selectedIdx && !isCorrect) btn.classList.add('wrong');
    });

    // Mostra il bottone "Prossima"
    document.getElementById('next-btn').classList.add('show');

    // Salva nel database
    const { error } = await s.from('quiz_answers')
    .upsert({
        user_id: currentUser.id,
        question_id: qId,
        is_correct: isCorrect
    }, { onConflict: 'user_id,question_id' });

    if (error) {
        showToast('Errore nel salvataggio della risposta.', true);
    } else {
        answeredMap[qId] = isCorrect;
        saveQuizState(); // Aggiorna stato salvato
        if (isCorrect) showToast('\u2705 Risposta corretta! +1 punto');
        else showToast('\u274c Risposta sbagliata.');
    }
}

function showFinalResults() {
    let correctCount = 0;
    for (let key in answeredMap) {
        if (answeredMap[key] === true) correctCount++;
    }

    const total = QUIZ_QUESTIONS.length;
    const percentage = Math.round((correctCount / total) * 100);

    let msg = '';
    if (percentage === 100) msg = '\ud83e\udd47 Perfetto! Sei un esperto di MotoGP!';
    else if (percentage >= 75) msg = '\ud83e\udd48 Ottimo lavoro! Conosci bene il Motomondiale.';
    else if (percentage >= 50) msg = '\ud83e\udd49 Discreto, ma c\u2019\u00e8 margine di miglioramento!';
    else msg = '\ud83d\udcda Meglio ripassare un po\u2019 di storia del Motomondiale!';

    document.getElementById('quiz-card').innerHTML =
        '<div style="text-align:center;">' +
            '<h2 style="font-family:\'Bebas Neue\'; font-size:1.8rem; margin-bottom:1rem;">Risultato Quiz</h2>' +
            '<div class="result-score">' + correctCount + ' / ' + total + '</div>' +
            '<p style="color:var(--muted); font-size:1.1rem; margin-bottom:1.5rem;">' + msg + '</p>' +
            '<p style="font-size:.9rem; color:var(--muted);">I tuoi punti sono stati aggiunti alla Classifica Globale!</p>' +
            '<a href="classifica_pronostici.html" style="display:inline-block; margin-top:1.5rem; background:var(--red); color:#fff; padding:.6rem 1.5rem; border-radius:6px; text-decoration:none; font-family:\'Barlow Condensed\'; font-weight:700; text-transform:uppercase;">\ud83c\udfc6 Vedi Classifica</a>' +
            '<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border);">' +
                '<p style="font-size:.85rem; color:var(--muted); margin-bottom:.8rem;">Vuoi rigiocare? Cliccando qui cancellerai le tue risposte precedenti per ripartire da zero.</p>' +
                '<button onclick="resetQuiz()" style="background:transparent; border:1px solid var(--border); color:#ff6b6b; padding:.5rem 1.2rem; border-radius:6px; cursor:pointer; font-family:\'Barlow Condensed\'; font-weight:700; text-transform:uppercase; font-size:.85rem;">\ud83d\udd04 Ricomincia il Quiz</button>' +
            '</div>' +
        '</div>';
}

async function resetQuiz() {
    if (!confirm('Sei sicuro di voler azzerare tutte le tue risposte? Perderai i punti acquisiti finora nel quiz!')) return;

    const { error } = await s.from('quiz_answers').delete().eq('user_id', currentUser.id);

    if (error) {
        showToast('Errore durante il reset.', true);
    } else {
        for (let key in answeredMap) { delete answeredMap[key]; }
        clearQuizState(); // Pulisci stato salvato

        activeQuestions = QUIZ_QUESTIONS.filter(q => answeredMap[q.id] === undefined);
        shuffleArray(activeQuestions);

        if (activeQuestions.length > 0) {
            currentQIndex = 0;
            renderQuestion(currentQIndex);
        } else {
            showFinalResults();
        }
        showToast('\u2705 Quiz azzerato! Puoi ricominciare.');
    }
}

function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e8001d' : '#222';
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 3000);
}

// ============================================================
// BOTTONE TORNA INDIETRO — FIXATO
// Usa document.referrer per sapere da dove sei venuto:
// - Se provieni da una pagina dello stesso sito (es. prediction.html o index.html)
//   → link diretto a quella pagina (pi\u00f9 affidabile di history.back())
// - Se hai aperto quiz.html direttamente (bookmark, URL digitato)
//   → link a index.html
// Lo stato del quiz viene salvato in localStorage prima di lasciare la pagina,
// cos\u00ec quando torni riprendi dalla domanda esatta in cui eri.
// ============================================================
var backWrap = document.querySelector('.back-btn-wrap');
if (backWrap) {
    var referrer = document.referrer;
    // Verifica che il referrer sia una pagina del nostro sito (e non quiz.html stesso)
    var isFromSameSite = referrer &&
                         referrer.indexOf('paggii.github.io') !== -1 &&
                         referrer.indexOf('quiz.html') === -1;

    if (isFromSameSite) {
        // Torna direttamente alla pagina di provenienza
        backWrap.innerHTML = '<a href="' + referrer + '" class="back-btn">\u2190 Torna alla pagina precedente</a>';
    } else if (referrer && referrer.indexOf('quiz.html') !== -1) {
        // Provieni da quiz.html stesso (es. refresh) → vai alla Home
        backWrap.innerHTML = '<a href="index.html" class="back-btn">\u2190 Torna alla Home</a>';
    } else {
        // Apertura diretta → vai alla Home
        backWrap.innerHTML = '<a href="index.html" class="back-btn">\u2190 Torna alla Home</a>';
    }
}

// Salva lo stato quando l'utente lascia la pagina (es. click sul back button, chiusura tab)
window.addEventListener('beforeunload', function() {
    saveQuizState();
});

initQuizPage();
