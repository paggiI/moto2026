<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Classifica Pronostici — Motomondiale 2026</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --red:#e8001d; --dark:#0a0a0a; --mid:#141414; --card:#1a1a1a; --border:#2a2a2a; --muted:#8a8a8a; --white:#f5f5f5; --gold:#ffd700; --silver:#c0c0c0; --bronze:#cd7f32; --green:#2ecc71; }
    [data-theme="light"] { --dark:#f5f5f5; --mid:#ececec; --card:#fff; --border:#d8d8d8; --muted:#666; --white:#111; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; line-height:1.6; min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem; }
    .container { width:100%; max-width:1200px; }
    .leaderboards-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; align-items:start; }
    .leaderboard-card { min-width:0; }
    .leaderboard-card .card-title { display:flex; align-items:center; gap:.5rem; }
    .quiz-title { color:#7cdbff; }
    .pred-title { color:var(--red); }
    @media (max-width: 800px) { .leaderboards-grid { grid-template-columns:1fr; } }
    .back-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1rem; border-radius:6px; background:var(--mid); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.8rem; margin-bottom:2rem; transition:.2s; }
    .back-btn:hover { border-color:var(--red); color:var(--white); }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:.04em; margin-bottom:.5rem; }
    h1 span { color:var(--red); }
    .subtitle { color:var(--muted); margin-bottom:2.5rem; font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; margin-bottom:1.2rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; letter-spacing:.04em; }
    .lb-user-card { border-bottom:1px solid var(--border); padding:.8rem 0; }
    .lb-user-card:last-child { border-bottom:none; }
    .lb-summary { display:flex; align-items:center; gap:1rem; cursor:pointer; list-style:none; }
    .lb-summary::-webkit-details-marker { display:none; }
    .lb-pos { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; width:40px; text-align:center; color:var(--muted); flex-shrink:0; }
    .lb-pos.top1 { color:var(--gold); }
    .lb-pos.top2 { color:var(--silver); }
    .lb-pos.top3 { color:var(--bronze); }
    .lb-name { flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:.5rem; }
    .lb-arrow { color:var(--muted); font-size:.8rem; transition:transform .2s; }
    details[open] .lb-arrow { transform:rotate(90deg); }
    .lb-score { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--red); flex-shrink:0; }
    .lb-details { margin-top:1rem; padding-left:1.5rem; border-left:2px solid var(--border); margin-left:1.5rem; }
    .lb-pred-row { margin-bottom:.8rem; font-family:'Barlow Condensed', sans-serif; font-size:.95rem; }
    .lb-pred-row strong { color:var(--white); }
    .lb-pred-row span { color:var(--muted); }
    .loading { text-align:center; color:var(--muted); padding:3rem 0; }
    
    /* SEZIONE VISIBILITÀ PUNTEGGIO */
    .visibility-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1rem 1.5rem; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .visibility-card .vis-label { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:.95rem; color:var(--white); }
    .visibility-card .vis-status { font-size:.85rem; color:var(--muted); margin-top:.2rem; }
    .vis-toggle-btn { background:var(--mid); border:1px solid var(--border); color:var(--white); padding:.5rem 1.2rem; border-radius:6px; cursor:pointer; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.85rem; transition:.2s; white-space:nowrap; }
    .vis-toggle-btn:hover { border-color:var(--red); }
    .vis-toggle-btn:disabled { opacity:.5; cursor:not-allowed; }
    
    /* TOAST */
    .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:1rem 1.5rem; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; z-index:9999; display:none; }
</style>
</head>
<body>

<div class="container">
    <div class="back-btn-wrap" style="margin-bottom: 2rem;"></div>
    <h1>Classifica <span>Globale</span></h1>
    <p class="subtitle">Il punteggio totale unisce i punti dei Pronostici GP e del Quiz Mid-Week!</p>

    <!-- SEZIONE VISIBILITÀ PUNTEGGIO (solo per utenti loggati) -->
    <div id="visibility-section" style="display:none;">
        <div class="visibility-card">
            <div>
                <div class="vis-label">👁️ Visibilità punteggio</div>
                <div class="vis-status" id="visibility-status">Caricamento...</div>
            </div>
            <button class="vis-toggle-btn" id="visibility-toggle-btn" onclick="toggleVisibility()" disabled>Caricamento...</button>
        </div>
    </div>

    <div class="leaderboards-grid">
        <div class="card leaderboard-card">
            <div class="card-title quiz-title">🧠 Classifica Quiz</div>
            <div id="quiz-leaderboard"><p class="loading">Caricamento classifica...</p></div>
        </div>
        <div class="card leaderboard-card">
            <div class="card-title pred-title">🏁 Classifica Prediction</div>
            <div id="prediction-leaderboard"><p class="loading">Caricamento classifica...</p></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://aysknebyyzljysxpsxdv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M1dPlowaVyeMJ1PXYl0uNw_Ha4GR_wZ';
const s = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ACTUAL_RESULTS = {
  '16': { 
    motogp_pole: 'Jorge Martín', motogp_sprint: 'Marc Márquez',motogp_win: 'Marc Márquez', motogp_p2: 'Jorge Martín', motogp_p3: 'Marco Bezzecchi',
    moto2_pole: 'Izan Guevara', moto2_win: 'Izan Guevara', moto2_p2: 'Tony Arbolino', moto2_p3: 'Filip Salač',
    moto3_pole: 'David Almansa', moto3_win: 'David Almansa', moto3_p2: 'Máximo Quiles', moto3_p3: 'Álvaro Carpe'
  },
  '17': { 
    motogp_pole: 'Raúl Fernández', motogp_sprint: 'Marc Márquez', motogp_win: 'Marco Bezzecchi', motogp_p2: 'Raúl Fernández', motogp_p3: 'Jorge Martín',
    moto2_pole: 'Izan Guevara', moto2_win: 'Izan Guevara', moto2_p2: 'Manuel González', moto2_p3: 'Daniel Holgado',
    moto3_pole: 'Brian Uriarte', moto3_win: 'Máximo Quiles', moto3_p2: 'David Almansa', moto3_p3: 'Brian Uriarte'
  },
  '18': { 
    motogp_pole: 'Marc Márquez', motogp_sprint: 'Marc Márquez', motogp_win: '', motogp_p2: '', motogp_p3: '',
    moto2_pole: 'Manuel González', moto2_win: '', moto2_p2: '', moto2_p3: '',
    moto3_pole: 'Veda Pratama', moto3_win: '', moto3_p2: '', moto3_p3: '',
  },
};

// ============================================================
// GESTIONE VISIBILITÀ PUNTEGGIO
// ============================================================

async function checkVisibility() {
    try {
        const { data: { session } } = await s.auth.getSession();
        if (!session || !session.user) {
            document.getElementById('visibility-section').style.display = 'none';
            return;
        }
        
        document.getElementById('visibility-section').style.display = 'block';
        
        const { data, error } = await s.rpc('get_my_leaderboard_visibility');
        if (error) {
            console.error('Errore caricamento visibilità:', error);
            document.getElementById('visibility-status').textContent = 'Errore caricamento stato.';
            return;
        }
        
        updateVisibilityUI(data === true);
    } catch (e) {
        console.error('Errore checkVisibility:', e);
        document.getElementById('visibility-section').style.display = 'none';
    }
}

function updateVisibilityUI(isHidden) {
    const statusEl = document.getElementById('visibility-status');
    const btnEl = document.getElementById('visibility-toggle-btn');
    
    if (isHidden) {
        statusEl.innerHTML = 'Il tuo punteggio è <strong style="color:#ff6b6b;">NASCOSTO</strong> dalla classifica.';
        btnEl.textContent = '👁️ Mostra punteggio';
        btnEl.style.borderColor = 'var(--green)';
        btnEl.style.color = 'var(--green)';
    } else {
        statusEl.innerHTML = 'Il tuo punteggio è <strong style="color:var(--green);">VISIBILE</strong> nella classifica.';
        btnEl.textContent = '🚫 Nascondi punteggio';
        btnEl.style.borderColor = '#ff6b6b';
        btnEl.style.color = '#ff6b6b';
    }
    btnEl.disabled = false;
}

async function toggleVisibility() {
    const btn = document.getElementById('visibility-toggle-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Aggiornamento...';
    
    try {
        const { data, error } = await s.rpc('toggle_my_leaderboard_visibility');
        
        if (error) {
            showToast('Errore: ' + error.message, true);
            btn.disabled = false;
            return;
        }
        
        updateVisibilityUI(data === true);
        showToast(data ? '✅ Punteggio nascosto dalla classifica' : '✅ Punteggio reso visibile');
        
        // Ricarica le classifiche per riflettere il cambio
        await loadLeaderboard();
    } catch (e) {
        showToast('Errore: ' + e.message, true);
        btn.disabled = false;
    }
}

function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e8001d' : '#222';
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 3000);
}

// ============================================================
// CARICAMENTO CLASSIFICHE
// ============================================================

async function loadLeaderboard() {
    // Recupera la lista di user_id nascosti (per filtrare dalla classifica prediction)
    var hiddenUserIds = new Set();
    try {
        var hiddenRes = await s.rpc('get_hidden_user_ids');
        if (hiddenRes.data) {
            hiddenRes.data.forEach(function(h) { hiddenUserIds.add(h.user_id); });
        }
    } catch(e) {
        console.warn('Impossibile caricare utenti nascosti:', e);
    }

    var predRes = await s.rpc('get_all_predictions');
    var quizRes = await s.rpc('get_quiz_scores');
    var predData = (!predRes.error && predRes.data) ? predRes.data : [];
    var quizData = (!quizRes.error && quizRes.data) ? quizRes.data : [];

    // ==========================================
    // CLASSIFICA QUIZ (già filtrata dal SQL — get_quiz_scores esclude nascosti)
    // ==========================================
    var quizRanking = quizData.map(function(q) {
        return { username: q.username, points: Number(q.correct_count) || 0 };
    }).sort(function(a, b) { return b.points - a.points; });

    // ==========================================
    // CLASSIFICA PREDICTION (filtra nascosti in JS)
    // ==========================================
    var predictionScores = {};
    predData.forEach(function(pred) {
        // Salta utenti nascosti
        if (hiddenUserIds.has(pred.user_id)) return;
        
        if (!predictionScores[pred.user_id]) {
            predictionScores[pred.user_id] = { username: pred.username, points: 0, rounds: [] };
        }
        
        var roundPoints = 0;
        if (ACTUAL_RESULTS[pred.round_id]) {
            var real = ACTUAL_RESULTS[pred.round_id];
            if (pred.motogp_winner === real.motogp_win) roundPoints += 5;
            if (pred.motogp_p2 === real.motogp_p2) roundPoints += 3;
            if (pred.motogp_p3 === real.motogp_p3) roundPoints += 2;
            if (pred.motogp_pole === real.motogp_pole) roundPoints += 3;
            if (pred.motogp_sprint === real.motogp_sprint) roundPoints += 3;
            if (pred.moto2_winner === real.moto2_win) roundPoints += 5;
            if (pred.moto2_p2 === real.moto2_p2) roundPoints += 3;
            if (pred.moto2_p3 === real.moto2_p3) roundPoints += 2;
            if (pred.moto2_pole === real.moto2_pole) roundPoints += 3;
            if (pred.moto3_winner === real.moto3_win) roundPoints += 5;
            if (pred.moto3_p2 === real.moto2_p2) roundPoints += 3;
            if (pred.moto3_p3 === real.moto3_p3) roundPoints += 2;
            if (pred.moto3_pole === real.moto3_pole) roundPoints += 3;
        }
        predictionScores[pred.user_id].points += roundPoints;
        predictionScores[pred.user_id].rounds.push({ round: pred.round_id, points: roundPoints, hasResult: !!ACTUAL_RESULTS[pred.round_id] });
    });

    var predictionRanking = Object.values(predictionScores).sort(function(a, b) { return b.points - a.points; });

    // ==========================================
    // RENDER CLASSIFICA QUIZ
    // ==========================================
    var quizHtml = '';
    if (quizRanking.length === 0) {
        quizHtml = '<p class="loading">Nessun risultato quiz.</p>';
    } else {
        quizRanking.forEach(function(user, index) {
            var pos = index + 1;
            var posClass = pos === 1 ? 'top1' : pos === 2 ? 'top2' : pos === 3 ? 'top3' : '';
            var medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '';
            quizHtml += '<div class="lb-user-card"><div class="lb-summary"><div class="lb-pos ' + posClass + '">' + pos + '</div><div class="lb-name">' + medal + ' ' + user.username + '</div><div class="lb-score">' + user.points + ' pt</div></div></div>';
        });
    }

    // ==========================================
    // RENDER CLASSIFICA PREDICTION
    // ==========================================
    var predictionHtml = '';
    if (predictionRanking.length === 0) {
        predictionHtml = '<p class="loading">Nessun pronostico calcolabile.</p>';
    } else {
        predictionRanking.forEach(function(user, index) {
            var pos = index + 1;
            var posClass = pos === 1 ? 'top1' : pos === 2 ? 'top2' : pos === 3 ? 'top3' : '';
            var medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '';
            var roundsHtml = user.rounds.map(function(r) {
                if (r.hasResult) {
                    return '<div style="padding:.5rem 0;border-bottom:1px solid var(--border);font-family:Barlow Condensed,sans-serif;font-size:1rem;display:flex;justify-content:space-between;">GP #' + r.round + '<span style="color:var(--red);font-weight:700;">' + r.points + ' pt</span></div>';
                } else {
                    return '<div style="padding:.5rem 0;border-bottom:1px solid var(--border);font-family:Barlow Condensed,sans-serif;font-size:1rem;display:flex;justify-content:space-between;color:var(--muted);">GP #' + r.round + '<span>⏳ In attesa di gara</span></div>';
                }
            }).join('');
            predictionHtml += '<details class="lb-user-card"><summary class="lb-summary"><div class="lb-pos ' + posClass + '">' + pos + '</div><div class="lb-name">' + medal + ' ' + user.username + '</div><div class="lb-arrow">▶</div><div class="lb-score">' + user.points + ' pt</div></summary><div class="lb-details"><div style="font-family:Barlow Condensed,sans-serif;font-size:.75rem;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;letter-spacing:.1em;">Dettaglio Pronostici GP</div>' + roundsHtml + '</div></details>';
        });
    }

    document.getElementById('quiz-leaderboard').innerHTML = quizHtml;
    document.getElementById('prediction-leaderboard').innerHTML = predictionHtml;
}

// ============================================================
// AVVIO
// ============================================================
checkVisibility();
loadLeaderboard();
</script>

<script>
// ── TORNA INDIETRO DINAMICO ──
(function(){
  var NAMES = {
    'index.html':'Home','motogp.html':'MotoGP','moto2.html':'Moto2',
    'moto3.html':'Moto3','piloti.html':'Piloti','pilota.html':'Pilota',
    'classifica.html':'Classifica','risultati.html':'Risultati',
    'calendario.html':'Calendario','stagione.html':'Stagione',
    'prediction.html':'Prediction','stats.html':'Statistiche',
    'albo_doro.html':"Albo d'oro",'circuiti.html':'Circuiti','guida.html':'Guida','relazione.html':'Relazione', 'team.html':'Team',
    'profilo.html':'Profilo', 'classifica_pronostici.html':'Classifica Pronostici'
  };
  var cur = (location.pathname.split('/').pop() || 'index.html');
  var curName = NAMES[cur] || cur;

  function showBackBtn() {
    var prev = sessionStorage.getItem('moto_from_url');
    var prevName = sessionStorage.getItem('moto_from_name');
    if ((!prev || !prevName) && document.referrer) {
      try {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin) {
          prev = ref.pathname.split('/').pop() || 'index.html';
          prevName = NAMES[prev] || prevName || prev;
        }
      } catch (e) {}
    }
    if (!prev) {
      prev = 'index.html';
      prevName = 'Home';
    }
    if (prev && prevName && prevName !== curName) {
      var wrap = document.querySelector('.back-btn-wrap');
      if (wrap) wrap.innerHTML = '<a class="back-btn" href="'+prev+'">← Torna a '+prevName+'</a>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBackBtn);
  } else {
    showBackBtn();
  }
  window.addEventListener('pageshow', showBackBtn);
})();
</script>
</body>
</html>
