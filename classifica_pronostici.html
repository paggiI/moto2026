<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Classifica Pronostici — Motomondiale 2026</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root { --red:#e8001d; --dark:#0a0a0a; --mid:#141414; --card:#1a1a1a; --border:#2a2a2a; --muted:#8a8a8a; --white:#f5f5f5; --gold:#ffd700; --silver:#c0c0c0; --bronze:#cd7f32; }
    [data-theme="light"] { --dark:#f5f5f5; --mid:#ececec; --card:#fff; --border:#d8d8d8; --muted:#666; --white:#111; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; line-height:1.6; min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem; }
    .container {
    width:100%;
    max-width:1200px;
}

.leaderboards-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.5rem;
    align-items:start;
}

.leaderboard-card {
    min-width:0;
}

.leaderboard-card .card-title {
    display:flex;
    align-items:center;
    gap:.5rem;
}

.quiz-title {
    color:#7cdbff;
}

.pred-title {
    color:var(--red);
}

@media (max-width: 800px) {
    .leaderboards-grid {
        grid-template-columns:1fr;
    }
}

    .back-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.5rem 1rem; border-radius:6px; background:var(--mid); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:.8rem; margin-bottom:2rem; transition:.2s; }
    .back-btn:hover { border-color:var(--red); color:var(--white); }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:.04em; margin-bottom:.5rem; }
    h1 span { color:var(--red); }
    .subtitle { color:var(--muted); margin-bottom:2.5rem; font-family:'Barlow Condensed',sans-serif; font-size:1.1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    .card-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; margin-bottom:1.2rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; letter-spacing:.04em; }
    
    /* NUOVO STILE CLASSIFICA ESPANDIBILE */
    .lb-user-card { border-bottom:1px solid var(--border); padding:.8rem 0; }
    .lb-user-card:last-child { border-bottom:none; }
    .lb-summary { display:flex; align-items:center; gap:1rem; cursor:pointer; list-style:none; }
    .lb-summary::-webkit-details-marker { display:none; }
    .lb-pos { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; width:40px; text-align:center; color:var(--muted); flex-shrink:0; }
    .lb-pos.top1 { color:var(--gold); }
    .lb-pos.top2 { color:var(--silver); }
    .lb-pos.top3 { color:var(--bronze); }
    .lb-name { flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:.5rem; }
    .lb-arrow { color:var(--muted); font-size:.8rem; transition:transform .2s; }
    details[open] .lb-arrow { transform:rotate(90deg); }
    .lb-score { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; color:var(--red); flex-shrink:0; }
    
    .lb-details { margin-top:1rem; padding-left:1.5rem; border-left:2px solid var(--border); margin-left:1.5rem; }
    .lb-pred-row { margin-bottom:.8rem; font-family:'Barlow Condensed', sans-serif; font-size:.95rem; }
    .lb-pred-row strong { color:var(--white); }
    .lb-pred-row span { color:var(--muted); }
    .loading { text-align:center; color:var(--muted); padding:3rem 0; }
</style>
</head>
<body>

<div class="container">
    <div class="back-btn-wrap" style="margin-bottom: 2rem;"></div>    
    <h1>Classifica <span>Globale</span></h1>
    <p class="subtitle">Il punteggio totale unisce i punti dei Pronostici GP e del Quiz Mid-Week!</p>

    <div class="leaderboards-grid">

    <!-- SINISTRA: QUIZ -->
    <div class="card leaderboard-card">
        <div class="card-title quiz-title">
            🧠 Classifica Quiz
        </div>

        <div id="quiz-leaderboard">
            <p class="loading">Caricamento classifica...</p>
        </div>
    </div>

    <!-- DESTRA: PREDICTION -->
    <div class="card leaderboard-card">
        <div class="card-title pred-title">
            🏁 Classifica Prediction
        </div>

        <div id="prediction-leaderboard">
            <p class="loading">Caricamento classifica...</p>
        </div>
    </div>

</div>

</div>

<script>
// Inizializza Supabase
const SUPABASE_URL = 'https://aysknebyyzljysxpsxdv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M1dPlowaVyeMJ1PXYl0uNw_Ha4GR_wZ';
const s = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==========================================
// INSERISCI QUI I RISULTATI REALI DELLE GARE
// ==========================================
const ACTUAL_RESULTS = {
  // Inserisci qui i risultati reali man mano che le gare si corrono
  '16': { 
    motogp_pole: 'Jorge Martín', motogp_sprint: 'Marc Márquez',motogp_win: 'Marc Márquez', motogp_p2: 'Jorge Martín', motogp_p3: 'Marco Bezzecchi',
    moto2_pole: 'Izan Guevara', moto2_win: 'Izan Guevara', moto2_p2: 'Tony Arbolino', moto2_p3: 'Filip Salač',
    moto3_pole: 'David Almansa', moto3_win: 'David Almansa', moto3_p2: 'Máximo Quiles', moto3_p3: 'Álvaro Carpe'
  },
  '17': { 
    motogp_pole: 'Raúl Fernández', motogp_sprint: 'Marc Márquez',
    moto2_pole: 'Tony Arbolino', 
    moto3_pole: 'Brian Uriarte', 
  },
  // Aggiungi righe qui per i prossimi round!
};

async function loadLeaderboard() {

    const { data: predData, error: predError } =
        await s.rpc('get_all_predictions');

    const { data: quizData, error: quizError } =
        await s.rpc('get_quiz_scores');


    // ==========================================
    // CLASSIFICA QUIZ
    // ==========================================

    let quizRanking = [];

    if (!quizError && quizData) {

        quizRanking = quizData
            .map(q => ({
                username: q.username,
                points: Number(q.correct_count) || 0
            }))
            .sort((a, b) => b.points - a.points);
    }


    // ==========================================
    // CLASSIFICA PREDICTION
    // ==========================================

    const predictionScores = {};

    if (!predError && predData) {

        predData.forEach(pred => {

            if (!predictionScores[pred.user_id]) {

                predictionScores[pred.user_id] = {
                    username: pred.username,
                    points: 0,
                    rounds: []
                };

            }

            let roundPoints = 0;

            if (ACTUAL_RESULTS[pred.round_id]) {

                const real = ACTUAL_RESULTS[pred.round_id];


                // ---------- MotoGP ----------

                if (pred.motogp_winner === real.motogp_win)
                    roundPoints += 5;

                if (pred.motogp_p2 === real.motogp_p2)
                    roundPoints += 3;

                if (pred.motogp_p3 === real.motogp_p3)
                    roundPoints += 2;

                if (pred.motogp_pole === real.motogp_pole)
                    roundPoints += 3;

                if (pred.motogp_sprint === real.motogp_sprint)
                    roundPoints += 3;


                // ---------- Moto2 ----------

                if (pred.moto2_winner === real.moto2_win)
                    roundPoints += 5;

                if (pred.moto2_p2 === real.moto2_p2)
                    roundPoints += 3;

                if (pred.moto2_p3 === real.moto2_p3)
                    roundPoints += 2;

                if (pred.moto2_pole === real.moto2_pole)
                    roundPoints += 3;


                // ---------- Moto3 ----------

                if (pred.moto3_winner === real.moto3_win)
                    roundPoints += 5;

                if (pred.moto3_p2 === real.moto3_p2)
                    roundPoints += 3;

                if (pred.moto3_p3 === real.moto3_p3)
                    roundPoints += 2;

                if (pred.moto3_pole === real.moto3_pole)
                    roundPoints += 3;
            }


            predictionScores[pred.user_id].points += roundPoints;

            predictionScores[pred.user_id].rounds.push({
                round: pred.round_id,
                points: roundPoints,
                hasResult: !!ACTUAL_RESULTS[pred.round_id]
            });

        });
    }


    const predictionRanking =
        Object.values(predictionScores)
            .sort((a, b) => b.points - a.points);


    // ==========================================
    // RENDER CLASSIFICA QUIZ
    // ==========================================

    let quizHtml = '';

    if (quizRanking.length === 0) {

        quizHtml =
            '<p class="loading">Nessun risultato quiz.</p>';

    } else {

        quizRanking.forEach((user, index) => {

            const pos = index + 1;

            const posClass =
                pos === 1 ? 'top1' :
                pos === 2 ? 'top2' :
                pos === 3 ? 'top3' : '';

            const medal =
                pos === 1 ? '🥇' :
                pos === 2 ? '🥈' :
                pos === 3 ? '🥉' : '';

            quizHtml += `
                <div class="lb-user-card">

                    <div class="lb-summary">

                        <div class="lb-pos ${posClass}">
                            ${pos}
                        </div>

                        <div class="lb-name">
                            ${medal} ${user.username}
                        </div>

                        <div class="lb-score">
                            ${user.points} pt
                        </div>

                    </div>

                </div>
            `;
        });
    }


    // ==========================================
    // RENDER CLASSIFICA PREDICTION
    // ==========================================

    let predictionHtml = '';

    if (predictionRanking.length === 0) {

        predictionHtml =
            '<p class="loading">Nessun pronostico calcolabile.</p>';

    } else {

        predictionRanking.forEach((user, index) => {

            const pos = index + 1;

            const posClass =
                pos === 1 ? 'top1' :
                pos === 2 ? 'top2' :
                pos === 3 ? 'top3' : '';

            const medal =
                pos === 1 ? '🥇' :
                pos === 2 ? '🥈' :
                pos === 3 ? '🥉' : '';


            const roundsHtml = user.rounds.map(r => {

                if (r.hasResult) {

                    return `
                        <div style="
                            padding:.5rem 0;
                            border-bottom:1px solid var(--border);
                            font-family:'Barlow Condensed',sans-serif;
                            font-size:1rem;
                            display:flex;
                            justify-content:space-between;
                        ">
                            GP #${r.round}

                            <span style="
                                color:var(--red);
                                font-weight:700;
                            ">
                                ${r.points} pt
                            </span>
                        </div>
                    `;

                } else {

                    return `
                        <div style="
                            padding:.5rem 0;
                            border-bottom:1px solid var(--border);
                            font-family:'Barlow Condensed',sans-serif;
                            font-size:1rem;
                            display:flex;
                            justify-content:space-between;
                            color:var(--muted);
                        ">
                            GP #${r.round}

                            <span>
                                ⏳ In attesa di gara
                            </span>
                        </div>
                    `;
                }

            }).join('');


            predictionHtml += `
                <details class="lb-user-card">

                    <summary class="lb-summary">

                        <div class="lb-pos ${posClass}">
                            ${pos}
                        </div>

                        <div class="lb-name">
                            ${medal} ${user.username}
                        </div>

                        <div class="lb-arrow">
                            ▶
                        </div>

                        <div class="lb-score">
                            ${user.points} pt
                        </div>

                    </summary>

                    <div class="lb-details">

                        <div style="
                            font-family:'Barlow Condensed',sans-serif;
                            font-size:.75rem;
                            text-transform:uppercase;
                            color:var(--muted);
                            margin-bottom:.5rem;
                            letter-spacing:.1em;
                        ">
                            Dettaglio Pronostici GP
                        </div>

                        ${roundsHtml}

                    </div>

                </details>
            `;
        });
    }


    // ==========================================
    // INSERISCE LE DUE CLASSIFICHE
    // ==========================================

    document.getElementById('quiz-leaderboard').innerHTML =
        quizHtml;

    document.getElementById('prediction-leaderboard').innerHTML =
        predictionHtml;
}


// Avvia il caricamento
loadLeaderboard();
</script>
<script>
// ── TORNA INDIETRO DINAMICO ──
(function(){
  var NAMES = {
    'index.html':'Home','motogp.html':'MotoGP','moto2.html':'Moto2',
    'moto3.html':'Moto3','piloti.html':'Piloti','pilota.html':'Pilota',
    'classifica.html':'Classifica','risultati.html':'Risultati',
    'calendario.html':'Calendario','stagione.html':'Stagione',
    'prediction.html':'Prediction','stats.html':'Statistiche',
    'albo_doro.html':"Albo d'oro",'circuiti.html':'Circuiti','guida.html':'Guida','relazione.html':'Relazione', 'team.html':'Team',
    'profilo.html':'Profilo', 'classifica_pronostici.html':'Classifica Pronostici'
  };
  var cur = (location.pathname.split('/').pop() || 'index.html');
  var curName = NAMES[cur] || cur;

  function showBackBtn() {
    var prev = sessionStorage.getItem('moto_from_url');
    var prevName = sessionStorage.getItem('moto_from_name');
    if ((!prev || !prevName) && document.referrer) {
      try {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin) {
          prev = ref.pathname.split('/').pop() || 'index.html';
          prevName = NAMES[prev] || prevName || prev;
        }
      } catch (e) {}
    }
    if (!prev) {
      prev = 'index.html';
      prevName = 'Home';
    }
    if (prev && prevName && prevName !== curName) {
      var wrap = document.querySelector('.back-btn-wrap');
      if (wrap) wrap.innerHTML = '<a class="back-btn" href="'+prev+'">← Torna a '+prevName+'</a>';
    }
  }

  function saveAndGo(href) {
    var dest = href.split('/').pop().split('?')[0].split('#')[0];
    if (NAMES[dest]) {
      sessionStorage.setItem('moto_from_url', location.href);
      sessionStorage.setItem('moto_from_name', curName);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBackBtn);
  } else {
    showBackBtn();
  }
  window.addEventListener('pageshow', showBackBtn);

  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto')) return;
    saveAndGo(href);
  }, true);
})();
</script>
</body>
</html>
