<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Moto2026</title>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --red:    #e8001d;
  --dark:   #0a0a0a;
  --mid:    #141414;
  --card:   #1a1a1a;
  --border: #2a2a2a;
  --muted:  #888;
  --white:  #f5f5f5;
}
[data-theme="light"] {
  --dark: #f4f4f4; --mid: #e8e8e8; --card: #fff; --border: #d0d0d0; --muted: #666; --white: #111;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--dark);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}
.reset-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--red);
  border-radius: 8px;
  padding: 2rem;
  max-width: 420px;
  width: 100%;
}
.reset-card h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: .04em;
  margin-bottom: .5rem;
}
.reset-card h1 span { color: var(--red); }
.reset-card p {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .95rem;
  color: var(--muted);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.field { margin-bottom: 1rem; }
.field label {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: .78rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .4rem;
}
.field input {
  width: 100%;
  padding: .7rem .9rem;
  background: var(--dark);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  font-size: .95rem;
  border-radius: 4px;
  outline: none;
  transition: border-color .15s;
}
.field input:focus { border-color: var(--red); }
.field-wrap { position: relative; }
.field-wrap .toggle {
  position: absolute; right: .7rem; bottom: .55rem;
  background: none; border: none; cursor: pointer;
  font-size: 1rem; padding: 0; line-height: 1; color: var(--muted);
}
.btn-primary {
  width: 100%;
  padding: .75rem;
  background: var(--red);
  color: #fff;
  border: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.05rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  transition: background .15s;
}
.btn-primary:hover { background: #c4001a; }
.btn-primary:disabled { background: var(--muted); cursor: not-allowed; }
.error-msg {
  background: rgba(232,0,29,.1);
  border: 1px solid rgba(232,0,29,.3);
  color: var(--red);
  padding: .6rem .8rem;
  border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .85rem;
  margin-bottom: 1rem;
  display: none;
}
.success-msg {
  background: rgba(0,255,0,.08);
  border: 1px solid rgba(0,255,0,.3);
  color: #00ff00;
  padding: .6rem .8rem;
  border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .85rem;
  margin-bottom: 1rem;
  display: none;
}
.back-link {
  display: block;
  text-align: center;
  margin-top: 1.2rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .82rem;
  color: var(--muted);
  text-decoration: none;
  letter-spacing: .04em;
}
.back-link:hover { color: var(--red); }
.requirements {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .75rem;
  color: var(--muted);
  margin-top: .4rem;
  line-height: 1.4;
}
</style>
</head>
<body>

<div class="reset-card">
  <h1>Nuova <span>Password</span></h1>
  <p id="intro-msg">Inserisci la tua nuova password per accedere di nuovo al tuo account.</p>

  <div class="error-msg" id="err"></div>
  <div class="success-msg" id="ok"></div>

  <div id="reset-form" style="display:none;">
    <div class="field">
      <label for="pass1">Nuova password</label>
      <div class="field-wrap">
        <input type="password" id="pass1" placeholder="••••••••">
        <button type="button" class="toggle" onclick="tog('pass1', this)">👁️</button>
      </div>
      <div class="requirements">Minimo 8 caratteri, una maiuscola e un numero.</div>
    </div>
    <div class="field">
      <label for="pass2">Conferma password</label>
      <div class="field-wrap">
        <input type="password" id="pass2" placeholder="••••••••">
        <button type="button" class="toggle" onclick="tog('pass2', this)">👁️</button>
      </div>
    </div>
    <button class="btn-primary" onclick="updatePassword()">Aggiorna password</button>
  </div>

  <div id="loading-msg" style="text-align:center; padding:2rem 0; color:var(--muted); font-family:'Barlow Condensed',sans-serif;">
    Verifica del link in corso...
  </div>

  <a href="index.html" class="back-link">← Torna alla home</a>
</div>

<script>
// ═══ COSTANTI SUPABASE — STESSO DI auth.js ═══
const SUPABASE_URL = 'https://aysknebyyzljysxpsxdv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M1dPlowaVyeMJ1PXYl0uNw_Ha4GR_wZ';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function tog(id, btn){
  const i = document.getElementById(id);
  if(i.type === 'password'){ i.type = 'text'; btn.innerHTML = '🙈'; }
  else { i.type = 'password'; btn.innerHTML = '👁️'; }
}

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
function showOk(msg){
  const el = document.getElementById('ok');
  el.textContent = msg;
  el.style.display = 'block';
}

// Controlla se arriviamo dal link email (Supabase mette access_token in query/hash)
async function checkRecovery(){
  // OnAuthStateChange scatta quando Supabase processa il token recovery
  let detected = false;
  
  sb.auth.onAuthStateChange(async (event, session) => {
    console.log('Auth event:', event);
    
    if(event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session?.user)){
      // Verifica se è un recovery (arrivato da email reset)
      const url = window.location.hash || window.location.search;
      const isRecovery = url.includes('type=recovery') || url.includes('access_token');
      
      if(isRecovery && !detected){
        detected = true;
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('reset-form').style.display = 'block';
        document.getElementById('intro-msg').textContent = 'Ciao ' + (session?.user?.email || '') + '! Inserisci la tua nuova password.';
      }
    }
  });

  // Fallback: dopo 3 secondi se non succede nulla, mostra errore
  setTimeout(() => {
    if(!detected){
      document.getElementById('loading-msg').style.display = 'none';
      showErr('Link non valido o scaduto. Richiedi un nuovo link di reset dalla pagina di login.');
      document.getElementById('intro-msg').textContent = 'Il link che hai seguito non è più valido.';
    }
  }, 3000);
}

// Aggiorna la password
async function updatePassword(){
  const p1 = document.getElementById('pass1').value;
  const p2 = document.getElementById('pass2').value;
  
  document.getElementById('err').style.display = 'none';
  document.getElementById('ok').style.display = 'none';
  
  if(!p1 || !p2){ showErr('Compila entrambi i campi.'); return; }
  if(p1 !== p2){ showErr('Le password non coincidono.'); return; }
  
  const passRegex = /^(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$/;
  if(!passRegex.test(p1)){
    showErr('La password deve avere almeno 8 caratteri, una maiuscola e un numero.');
    return;
  }
  
  const { data, error } = await sb.auth.updateUser({ password: p1 });
  
  if(error){
    showErr('Errore: ' + error.message);
    return;
  }
  
  showOk('✅ Password aggiornata con successo!');
  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('intro-msg').textContent = 'Password aggiornata. Verrai reindirizzato alla home in 3 secondi...';
  
  // Logout (così l'utente deve rifare login con la nuova password)
  await sb.auth.signOut();
  
  // Redirect alla home dopo 3 secondi
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 3000);
}

// Init
window.addEventListener('DOMContentLoaded', checkRecovery);
</script>
</body>
</html>
